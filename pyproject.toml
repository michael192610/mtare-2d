[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtare-2d-adaptation"
version = "0.1.0"
description = "M-TARE-based 2D multi-robot exploration research baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "matplotlib==3.11.2", "ortools==9.15.6755"]

[project.optional-dependencies]
irsim = ["ir-sim @ git+https://github.com/hanruihua/ir-sim.git@dbfb4f980c8f1c94171bffae3f67c58ad84dbdf1"]
recording = ["ir-sim @ git+https://github.com/hanruihua/ir-sim.git@dbfb4f980c8f1c94171bffae3f67c58ad84dbdf1", "rerun-sdk==0.43.2"]

[tool.setuptools.packages.find]
include = ["mtare_2d*", "ir_sim*"]
